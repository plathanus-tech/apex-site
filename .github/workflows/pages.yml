# Publica o site no GitHub Pages a cada envio para a branch main (ou manualmente, em Actions > Run workflow).
# Endereço: https://<organização>.github.io/<repositório>/  (o site é gerado para essa subpasta pela variável BASE_PATH)
# Ativação única: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-apex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-apex/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-apex/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
